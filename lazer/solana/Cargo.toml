[package]
name = "pyth-lazer-solana-example"
version = "0.1.0"
edition = "2021"

[lib]
name = "pyth_lazer_solana_example"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "client"
required-features = ["client"]

[dependencies]
anchor-lang = { version = "1.2.2", default-features = false, features = ["solana-v4"] }
anyhow = { version = "1.0.93", optional = true }
bytemuck = { version = "1.20.0", features = ["derive"] }
env_logger = { version = "0.11.5", optional = true }
hex = { version = "0.4.3", optional = true }
num-derive = "0.4.2"
num-traits = "0.2.19"
pyth-lazer-solana-contract = { version = "0.11.0", features = ["no-entrypoint"] }
solana-keypair = { version = "3.1.2", optional = true }
solana-message = { version = "4.6.0", optional = true }
solana-program = "4.1.0"
solana-rpc-client = { version = "4.3.2", optional = true }
solana-sdk-ids = "3.1.0"
solana-signer = { version = "3.0.1", optional = true }
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
solana-transaction = { version = "4.3.0", optional = true }

[dev-dependencies]
hex = "0.4.3"
litesvm = { version = "0.18.2", features = ["precompiles"] }
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction = "4.3.0"

[features]
client = [
  "dep:anyhow",
  "dep:env_logger",
  "dep:hex",
  "dep:solana-keypair",
  "dep:solana-message",
  "dep:solana-rpc-client",
  "dep:solana-signer",
  "dep:solana-transaction",
]
